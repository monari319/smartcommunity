plugins {
    id 'com.android.application'
}

def webAppUrl = System.getenv('WEB_APP_URL') ?: 'https://monari319.github.io/smartcommunity/'

android {
    namespace 'com.smartcommunity.portal'
    compileSdk 35

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId 'com.smartcommunity.portal'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0'
        buildConfigField 'String', 'WEB_APP_URL', "\"${webAppUrl}\""
    }
}
